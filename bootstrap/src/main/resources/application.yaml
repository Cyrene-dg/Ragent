server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: root
    password: 1234
    url: jdbc:mysql://127.0.0.1:3306/ragent?characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456

milvus:
  uri: http://localhost:19530

rag:
  default:
    collection-name: rag_default_store
    dimension: 4096
    metric-type: COSINE

  query-rewrite:
    enabled: true
    max-history-messages: 4
    max-history-chars: 500

  intent:
    prefilter:
      enabled: true
      candidate-limit: 80
      min-candidate-limit: 50
      max-candidate-limit: 100
      rule-enabled: true
      keyword-enabled: true
      vector-enabled: true
      vector-async-warmup: true
      rule-top-k: 80
      keyword-top-k: 80
      vector-top-k: 80
      rule-quota: 20
      keyword-quota: 20
      vector-quota: 20
      rule-weight: 1.0
      keyword-weight: 0.9
      vector-weight: 1.1
      max-alias-terms-per-intent: 12
      min-rule-trigger-length: 2

  rate-limit:
    global:
      enabled: true
      max-concurrent: 1
      max-wait-seconds: 3
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 4
    summary-start-turns: 5
    summary-enabled: true
    ttl-minutes: 60
    summary-max-chars: 200
    title-max-length: 30

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  mcp:
    servers:
      - name: default
        url: http://localhost:9099

  search:
    channels:
      vector-global:
        confidence-threshold: 0.6
        top-k-multiplier: 3
      intent-directed:
        min-intent-score: 0.4
        top-k-multiplier: 2
      keyword-es:
        enabled: true
        base-url: http://localhost:9200
        index-name: ragent_chunk_v1
        top-k-multiplier: 2
        min-intent-score: 0.4
        fallback-when-no-intent: true
        title-boost: 3.0
        keywords-boost: 2.0
        content-boost: 1.0
        phrase-boost: 1.2
        min-score: 0.0
        connect-timeout-ms: 1000
        write-timeout-ms: 3000
        read-timeout-ms: 3000
        call-timeout-ms: 4000
        max-retries: 1
        retry-backoff-ms: 120
        refresh-on-write: true
        backfill-on-startup: false
        backfill-batch-size: 500
        # A manual backfill can be restricted to v7 with this allow-list.
        backfill-kb-ids:
          - 2080272025011851264

  metadata-routing:
    enabled: true
    execution-enabled: true
    # Set false only for the v7 metadata retrieval baseline in offline A/B evaluation.
    element-facet-enabled: true
    # Set true only in a local evaluation process; it exposes raw retrieval candidates.
    evaluation-enabled: false
    intent-routes-location: file:resources/genshin_seed_v7/config/intent_routes.json
    entity-catalog-location: file:resources/genshin_seed_v7/config/entity_catalog.jsonl
    entity-fallback-kb-id: 2080272025011851264
    entity-fallback-collection-name: genshinroutingv7
    target-candidate-count: 20
    max-candidate-pool: 40
    # Only activates after cross-channel de-duplication exceeds this safety ceiling.
    max-rerank-candidates: 80
    rrf-rank-constant: 60

  trace:
    enabled: true
    max-error-length: 1000

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /api/chat
        embedding: /api/embed
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        embedding: /compatible-mode/v1/embeddings
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
    siliconflow:
      url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    default-model: qwen3-max
    deep-thinking-model: qwen3-max
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
        priority: 1
      - id: qwen3-max
        provider: bailian
        model: qwen3-max
        supports-thinking: true
        priority: 3
      - id: glm-4.7
        provider: siliconflow
        model: Pro/zai-org/GLM-4.7
        supports-thinking: true
        priority: 0
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
        priority: 2

  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: text-embedding-v4
        provider: bailian
        model: text-embedding-v4
        dimension: 1024
        priority: 0
      - id: qwen-emb-8b
        provider: siliconflow
        model: Qwen/Qwen3-Embedding-8B
        dimension: 4096
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: 4096
        priority: 2

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

rustfs:
  url: http://localhost:9000
  access-key-id: rustfsadmin
  secret-access-key: rustfsadmin

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

app:
  demo-mode: false
